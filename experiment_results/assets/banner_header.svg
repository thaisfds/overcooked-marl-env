<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d0628" />
      <stop offset="35%" stop-color="#1e1147" />
      <stop offset="70%" stop-color="#1d2671" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <linearGradient id="neonBorder" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ec4899" />
      <stop offset="30%" stop-color="#a855f7" />
      <stop offset="65%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#00f2fe" />
    </linearGradient>

    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f5d0fe" />
      <stop offset="40%" stop-color="#d8b4fe" />
      <stop offset="75%" stop-color="#93c5fd" />
      <stop offset="100%" stop-color="#67e8f9" />
    </linearGradient>

    <linearGradient id="pillGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b1d7a" stop-opacity="0.75" />
      <stop offset="100%" stop-color="#172554" stop-opacity="0.75" />
    </linearGradient>

    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="24" result="blur" />
    </filter>

    <pattern id="cyberGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#a855f7" stroke-width="0.6" stroke-opacity="0.14" />
    </pattern>
  </defs>

  <rect x="4" y="4" width="1192" height="292" rx="22" fill="url(#bgGrad)" stroke="url(#neonBorder)" stroke-width="3" />
  <rect x="4" y="4" width="1192" height="292" rx="22" fill="url(#cyberGrid)" />

  <circle cx="160" cy="70" r="110" fill="#a855f7" opacity="0.22" filter="url(#softGlow)" />
  <circle cx="1040" cy="230" r="130" fill="#3b82f6" opacity="0.24" filter="url(#softGlow)" />
  <circle cx="600" cy="145" r="140" fill="#ec4899" opacity="0.12" filter="url(#softGlow)" />

  <rect x="80" y="18" width="1040" height="2" rx="1" fill="url(#neonBorder)" opacity="0.65" />
  <rect x="180" y="280" width="840" height="2" rx="1" fill="url(#neonBorder)" opacity="0.55" />

  <g fill="#f0abfc" opacity="0.85">
    <path d="M 75 65 Q 85 65 85 55 Q 85 65 95 65 Q 85 65 85 75 Q 85 65 75 65 Z" />
    <path d="M 1100 60 Q 1112 60 1112 48 Q 1112 60 1124 60 Q 1112 60 1112 72 Q 1112 60 1100 60 Z" fill="#67e8f9" />
    <path d="M 1055 110 Q 1061 110 1061 104 Q 1061 110 1067 110 Q 1061 110 1061 116 Q 1061 110 1055 110 Z" fill="#c084fc" />
    <path d="M 130 235 Q 138 235 138 227 Q 138 235 146 235 Q 138 235 138 243 Q 138 235 130 235 Z" fill="#60a5fa" />
    <circle cx="230" cy="48" r="2.5" fill="#67e8f9" />
    <circle cx="960" cy="52" r="3" fill="#f472b6" />
  </g>

  <g transform="translate(82, 108)" filter="url(#neonGlow)">
    <rect x="0" y="0" width="76" height="76" rx="18" fill="url(#pillGrad)" stroke="#c084fc" stroke-width="2" />
    <text x="38" y="52" font-family="'Segoe UI Emoji', 'Apple Color Emoji', sans-serif" font-size="38" text-anchor="middle">🎮</text>
  </g>

  <g transform="translate(1042, 108)" filter="url(#neonGlow)">
    <rect x="0" y="0" width="76" height="76" rx="18" fill="url(#pillGrad)" stroke="#38bdf8" stroke-width="2" />
    <text x="38" y="52" font-family="'Segoe UI Emoji', 'Apple Color Emoji', sans-serif" font-size="38" text-anchor="middle">🍳</text>
  </g>

  <g transform="translate(600, 54)">
    <rect x="-215" y="-22" width="430" height="32" rx="16" fill="#2e1065" fill-opacity="0.8" stroke="#a855f7" stroke-width="1.5" />
    <text x="0" y="-1" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-size="13.5" font-weight="bold" fill="#e9d5ff" letter-spacing="2" text-anchor="middle">
      ✦ MULTI-AGENT REINFORCEMENT LEARNING ✦
    </text>
  </g>

  <text x="600" y="132" font-family="'Trebuchet MS', 'Segoe UI', system-ui, sans-serif" font-size="52" font-weight="900" fill="url(#titleGrad)" text-anchor="middle" filter="url(#neonGlow)" letter-spacing="1.2">
    Overcooked MARL Environment
  </text>

  <text x="600" y="174" font-family="'Segoe UI', 'Helvetica Neue', sans-serif" font-size="19.5" font-weight="600" fill="#cbd5e1" text-anchor="middle">
    Cooperative Multi-Agent Kitchen Simulation • PettingZoo &amp; Gymnasium 💜💙
  </text>

  <g transform="translate(600, 232)" font-family="'Segoe UI', sans-serif" font-size="13.5" font-weight="700">
    <g transform="translate(-375, 0)">
      <rect x="-110" y="-19" width="220" height="36" rx="18" fill="url(#pillGrad)" stroke="#c084fc" stroke-width="1.5" />
      <text x="0" y="4" fill="#f3e8ff" text-anchor="middle">👾 1 to 4 Cooperative Agents</text>
    </g>
    <g transform="translate(-125, 0)">
      <rect x="-110" y="-19" width="220" height="36" rx="18" fill="url(#pillGrad)" stroke="#818cf8" stroke-width="1.5" />
      <text x="0" y="4" fill="#e0e7ff" text-anchor="middle">🧠 PPO • DQN • IMPALA • APPO</text>
    </g>
    <g transform="translate(125, 0)">
      <rect x="-110" y="-19" width="220" height="36" rx="18" fill="url(#pillGrad)" stroke="#38bdf8" stroke-width="1.5" />
      <text x="0" y="4" fill="#e0f2fe" text-anchor="middle">✨ Dynamic Maps &amp; Recipes</text>
    </g>
    <g transform="translate(375, 0)">
      <rect x="-110" y="-19" width="220" height="36" rx="18" fill="url(#pillGrad)" stroke="#f472b6" stroke-width="1.5" />
      <text x="0" y="4" fill="#fce7f3" text-anchor="middle">🕹️ Interactive Keyboard Play</text>
    </g>
  </g>
</svg>
